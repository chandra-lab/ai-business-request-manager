services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aibrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aibrm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aibrm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aibrm} -d ${POSTGRES_DB:-aibrm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-aibrm}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-aibrm_dev_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aibrm}:${POSTGRES_PASSWORD:-aibrm_dev_password}@postgres:5432/${POSTGRES_DB:-aibrm}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-aibrm}:${RABBITMQ_PASSWORD:-aibrm_dev_password}@rabbitmq:5672//
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aibrm}:${POSTGRES_PASSWORD:-aibrm_dev_password}@postgres:5432/${POSTGRES_DB:-aibrm}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-aibrm}:${RABBITMQ_PASSWORD:-aibrm_dev_password}@rabbitmq:5672//
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    command: celery -A app.modules.workers.celery_app.celery_app worker --loglevel=INFO

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # Empty = same-origin requests via Vite proxy (works through remote port forwards).
      # Do NOT set http://localhost:8000 here — browsers on another machine cannot reach it.
      VITE_API_BASE_URL: ""
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres_data:
  uploads_data:
